<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宽基指数对比 — 沪深300 / 中证500 / 中证A500 / 中证1000</title>
<style>
  :root {
    --bg: #f6f8fb; --card: #ffffff; --text: #1e293b; --sub: #64748b;
    --border: #e8ecf1; --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  .container { max-width: 1150px; margin: 0 auto; padding: 32px 24px 60px; }

  header { text-align: center; padding: 36px 0 20px; }
  header .kicker {
    display: inline-block; font-size: 13px; letter-spacing: 2px; color: var(--sub);
    background: #eef1f6; padding: 4px 14px; border-radius: 999px; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: 800; }
  header p { color: var(--sub); margin-top: 8px; font-size: 14px; }
  .back-link {
    display: inline-block; margin-top: 12px; font-size: 13px; color: #3b82f6;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }

  #live-banner {
    display: none; text-align: center; font-size: 13px; padding: 8px 16px;
    border-radius: 999px; margin: 14px auto 0; max-width: 640px;
    background: #eefdf3; color: #15803d; border: 1px solid #bbf7d0;
  }

  .chart-card {
    margin-top: 26px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; color: var(--sub); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  #chart { width: 100%; height: 480px; }

  .zoom-hint {
    margin-top: 10px; font-size: 12px; color: var(--sub); text-align: center;
    background: #f8fafc; border: 1px dashed #d7dee8; border-radius: 8px; padding: 6px;
  }

  .table-wrap {
    margin-top: 26px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 1px 2px rgba(15,23,42,.04); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 13px 18px; text-align: center; font-size: 14px; }
  thead th {
    background: #f8fafc; font-weight: 700; border-bottom: 2px solid var(--border);
  }
  thead th .sub { display: block; font-size: 11px; color: var(--sub); font-weight: 500; margin-top: 2px; }
  tbody td { border-bottom: 1px solid #f1f5f9; }
  tbody tr:last-child td { border-bottom: none; }
  tbody td:first-child { text-align: left; color: var(--sub); background: #fbfcfd; font-weight: 600; }
  .val { font-weight: 800; font-size: 15px; }
  .up { color: #dc2626; }
  .down { color: #16a34a; }
  .range-note { margin-top: 10px; font-size: 12px; color: var(--sub); text-align: center; }

  footer {
    text-align: center; color: #94a3b8; font-size: 12px; margin-top: 40px;
    padding-top: 20px; border-top: 1px solid var(--border);
  }
  @media (max-width: 720px) {
    #chart { height: 360px; }
    header h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="kicker">宽基指数对比 · 实时数据</div>
    <h1>沪深300 / 中证500 / 中证A500 / 中证1000</h1>
    <p>2022-01-01 起走势 · 拖拽下方滑块或滚动鼠标滚轮缩放时间范围 · 收益随范围实时更新</p>
    <div id="live-banner"></div>
    <a class="back-link" href="index.html">← 返回基金组合对比页</a>
  </header>

  <div class="chart-card">
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
    <div class="zoom-hint">🖱 拖动底部滑块调整时间范围 · 滚轮缩放 · 收益表格随范围自动更新</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>指数</th>
          <th>区间收益</th>
          <th>年化收益</th>
          <th>区间起点收盘</th>
          <th>区间终点收盘</th>
        </tr>
      </thead>
      <tbody id="stats-body">
        <tr><td colspan="5" style="text-align:center;color:var(--sub)">数据加载中…</td></tr>
      </tbody>
    </table>
    <div class="range-note" id="range-note">统计区间：—</div>
  </div>

  <footer>
    数据来源：东方财富 / 腾讯 / 新浪（实时多源，指数点位）· 打开页面时自动更新<br>
    中证A500 指数发布于 2024-09，2022 起为指数公司回溯点位<br>
    本页面仅供研究参考，不构成任何投资建议。
  </footer>

</div>

<script src="js/data.js"></script>
<script src="js/indices.js"></script>
</body>
</html>
